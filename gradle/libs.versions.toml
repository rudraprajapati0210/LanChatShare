[versions]
ktor = "3.6.1"
agp = "9.5.2"
kotlin = "2.4.21"
hilt = "2.60.1"
[plugins]
app = { id = "com.android.application", version.ref = "agp" }
library = { id = "com.android.library", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.14" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
[libraries]
bom = { module = "androidx.compose:compose-bom", version = "2026.11.01" }
material = { module = "androidx.compose.material3:material3" }
activity = { module = "androidx.activity:activity-compose", version = "1.13.0" }
store = { module = "androidx.datastore:datastore-preferences", version = "1.3.0" }
splash = { module = "androidx.core:core-splashscreen", version = "1.2.0" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.11.1" }
viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version = "2.11.1" }
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
junit = { module = "junit:junit", version = "4.13.2" }
uitest = { module = "androidx.compose.ui:ui-test-junit4" }
runner = { module = "androidx.test:runner", version = "1.7.0" }
ext = { module = "androidx.test.ext:junit", version = "1.3.0" }
json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.13.0" }
room = { module = "androidx.room:room-runtime", version = "2.8.5" }
roomCompiler = { module = "androidx.room:room-compiler", version = "2.8.5" }

ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
