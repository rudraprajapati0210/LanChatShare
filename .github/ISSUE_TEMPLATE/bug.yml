name: Bug report
description: Report a reproducible problem on a phone or emulator
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Include expected and observed behaviour. Use fictional files and names.
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Phone models, Android versions and app release
    validations:
      required: true
  - type: textarea
    id: connection
    attributes:
      label: Connection and screen state
      description: For transfer issues include router, hotspot or Direct, direction, size, screen state and resume offset if known.
